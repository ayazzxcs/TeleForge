name: Build TeleForge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_UPSTREAM_REPO: https://github.com/DrKLO/Telegram.git
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 36

jobs:
  build:
    name: Build TeleForge Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout TeleForge
        uses: actions/checkout@v4

      - name: Validate Telegram API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_API_ID:-}"
          test -n "${TELEGRAM_API_HASH:-}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip

      - name: Clone official Telegram Android source
        run: |
          git clone --recursive --shallow-submodules "$TELEGRAM_UPSTREAM_REPO" upstream

      - name: Apply TeleForge source patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-teleforge-patches.py"
          python3 "$GITHUB_WORKSPACE/scripts/apply-teleforge-ui.py"

      - name: Configure Telegram credentials
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import os; import re; p=Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"); s=p.read_text(); s,n1=re.subn(r"public static int APP_ID = [0-9]+;", "public static int APP_ID = "+os.environ["TELEGRAM_API_ID"]+";", s, count=1); s,n2=re.subn(r"public static String APP_HASH = \"[^\"]*\";", "public static String APP_HASH = \""+os.environ["TELEGRAM_API_HASH"]+"\";", s, count=1); assert n1==1 and n2==1; p.write_text(s)'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build TeleForge debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find upstream -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; || true

      - name: Upload TeleForge APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeleForge-debug
          path: artifacts/*.apk
          if-no-files-found: error
