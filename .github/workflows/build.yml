name: Build TeleForge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_UPSTREAM_REPO: https://github.com/DrKLO/Telegram.git
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 36

jobs:
  build:
    name: Build TeleForge Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout TeleForge
        uses: actions/checkout@v4

      - name: Validate Telegram API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_API_ID:-}"
          test -n "${TELEGRAM_API_HASH:-}"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip

      - name: Clone official Telegram Android source
        run: |
          git clone --recursive --shallow-submodules "$TELEGRAM_UPSTREAM_REPO" upstream

      - name: Apply TeleForge source patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply-teleforge-patches.py"
          python3 "$GITHUB_WORKSPACE/scripts/apply-teleforge-ui.py"

      - name: Verify TeleForge UI source patches
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "Power Folders activity": (Path("TMessagesProj/src/main/java/org/telegram/ui/TeleForgeFoldersActivity.java"), None),
              "custom navigation field": (Path("TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java"), "private MainTabsLayout teleForgeTabsView;"),
              "custom navigation method": (Path("TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java"), "createTeleForgeNavigation(Context context)"),
              "Folders drawable": (Path("TMessagesProj/src/main/java/org/telegram/ui/MainTabsActivity.java"), "R.drawable.msg_folders"),
              "TeleForge dialogs title": (Path("TMessagesProj/src/main/java/org/telegram/ui/DialogsActivity.java"), 'actionBar.setTitle("TeleForge", statusDrawable);'),
              "Power Folders hero": (Path("TMessagesProj/src/main/java/org/telegram/ui/TeleForgeFoldersActivity.java"), "Your chats, your way."),
              "icon tab factory": (Path("TMessagesProj/src/main/java/org/telegram/ui/Components/glass/GlassTabView.java"), "createIconTab(Context context"),
          }

          missing = []
          for name, (path, needle) in checks.items():
              if not path.is_file():
                  missing.append(f"{name}: file missing -> {path}")
                  continue
              if needle is not None and needle not in path.read_text(encoding="utf-8"):
                  missing.append(f"{name}: expected text missing -> {needle}")
                  continue
              print(f"OK: {name}")

          if missing:
              print("FAILED GENERATED-SOURCE VERIFICATION:")
              for item in missing:
                  print(f"  - {item}")
              raise SystemExit(1)
          print("Verified: all TeleForge UI source patches are present before Gradle.")
          PY

      - name: Configure Telegram credentials
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'from pathlib import Path; import os; import re; p=Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"); s=p.read_text(); s,n1=re.subn(r"public static int APP_ID = [0-9]+;", "public static int APP_ID = "+os.environ["TELEGRAM_API_ID"]+";", s, count=1); s,n2=re.subn(r"public static String APP_HASH = \"[^\"]*\";", "public static String APP_HASH = \""+os.environ["TELEGRAM_API_HASH"]+"\";", s, count=1); assert n1==1 and n2==1; p.write_text(s)'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build TeleForge debug APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find upstream -type f \( -name '*.apk' -o -name '*.aab' \) -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; || true

      - name: Upload TeleForge APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeleForge-debug
          path: artifacts/*.apk
          if-no-files-found: error
