name: Build TeleForge

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TELEGRAM_UPSTREAM_REPO: https://github.com/DrKLO/Telegram.git
  TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
  TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
  ANDROID_NDK_VERSION: 27.2.12479018
  ANDROID_API_LEVEL: 36

jobs:
  build:
    name: Build TeleForge Android
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout TeleForge
        uses: actions/checkout@v4

      - name: Validate Telegram API credentials
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TELEGRAM_API_ID:-}" || -z "${TELEGRAM_API_HASH:-}" ]]; then
            echo "TELEGRAM_API_ID and TELEGRAM_API_HASH must be configured as GitHub Actions secrets."
            exit 1
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 unzip

      - name: Clone official Telegram Android source
        run: |
          git clone --recursive --shallow-submodules "$TELEGRAM_UPSTREAM_REPO" upstream

      - name: Configure TeleForge API credentials
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/configure-upstream.py"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-${ANDROID_API_LEVEL}" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Build upstream baseline APK
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleAfatDebug --no-daemon --stacktrace

      - name: Collect APKs
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find upstream -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \; || true

      - name: Upload TeleForge APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TeleForge-debug
          path: artifacts/*.apk
          if-no-files-found: error
